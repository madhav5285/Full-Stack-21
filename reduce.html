<body>
    <script>
        const num= [1,33,31,556,323,5322,2,5,6,7];
        const even= num.filter((i)=>(i%2==0));
        const square= even.map((i)=>(i*i));
        
        const sum = square.reduce((i,su)=>(i+su));
        console.log("sum :",sum);
    </script>
</body>
